{% extends "base.html" %}

{% block title %}Edit Profile · {{ p.name }}{% endblock %}

{% block content %}
<header class="profile-hero text-white">
  <div class="hero-overlay"></div>
  <div class="container position-relative">
    <div class="py-4 text-center text-lg-start">
      <h1 class="h3 fw-bold mb-1"><i class="bi bi-pencil-square me-2"></i>Edit Profile</h1>
      <p class="mb-0 text-white-50">Update your details and save.</p>
    </div>
  </div>
</header>

<main class="container py-5">
  <div class="content-card p-4 p-md-5 rounded-4 shadow-sm mx-auto" style="max-width: 820px;">
    <form method="post" action="{{ url_for('main.edit') }}">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-medium">Name</label>
          <input name="name" class="form-control" value="{{ p.name }}" required />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-medium">Title</label>
          <input name="title" class="form-control" value="{{ p.title }}" required />
        </div>

        <div class="col-12">
          <label class="form-label fw-medium">Hero summary</label>
          <textarea name="summary" class="form-control" rows="2" required>{{ p.summary }}</textarea>
        </div>

        <div class="col-12">
          <label class="form-label fw-medium">About</label>
          <textarea name="about" class="form-control" rows="4" required>{{ p.about }}</textarea>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-medium">Location</label>
          <input name="location" class="form-control" value="{{ p.location }}" />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-medium">Email</label>
          <input name="email" type="email" class="form-control" value="{{ p.email }}" />
        </div>

        <div class="col-md-6">
          <label class="form-label fw-medium">GitHub URL</label>
          <input name="github" class="form-control" value="{{ p.github }}" />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-medium">LinkedIn URL</label>
          <input name="linkedin" class="form-control" value="{{ p.linkedin }}" />
        </div>

        <div class="col-6 col-md-3">
          <label class="form-label fw-medium">Years Exp.</label>
          <input name="years_experience" class="form-control" value="{{ p.years_experience }}" />
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label fw-medium">Pipelines</label>
          <input name="pipelines" class="form-control" value="{{ p.pipelines }}" />
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label fw-medium">Uptime</label>
          <input name="uptime" class="form-control" value="{{ p.uptime }}" />
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label fw-medium">Clusters</label>
          <input name="clusters" class="form-control" value="{{ p.clusters }}" />
        </div>
      </div>

      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary px-4 fw-semibold">
          <i class="bi bi-check-lg me-2"></i>Save changes
        </button>
        <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary px-4">Cancel</a>
      </div>
    </form>
  </div>
</main>
{% endblock %}
