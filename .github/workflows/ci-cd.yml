name: CI/CD — Test, Scan, Build & Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/two-tire-profile

jobs:
  # 1a) Unit tests — the primary correctness gate
  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  # 1b) Static analysis — runs in parallel with tests
  code-quality:
    name: SonarQube + Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # 1c) DAST — boot the real two-tier stack and attack it over HTTP
  dast:
    name: OWASP ZAP Baseline (DAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Start the two-tier stack
        run: docker compose up -d --build

      - name: Wait for the app to be healthy
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:5000/health && exit 0
            sleep 2
          done
          echo "App never became healthy"
          docker compose logs
          exit 1

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:5000
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          artifact_name: zap-baseline-report
          # Report-only for now: findings land in the artifact + job summary.
          # Flip to true to make DAST a hard gate that fails the pipeline.
          fail_action: false

  # 2) Build → Trivy → push. Needs ALL THREE gates; skipped on pull_request.
  build-scan-push:
    name: Build → Trivy → Push
    needs: [test, code-quality, dast]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (load locally, do not push yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Push image (only reached if Trivy passed)
        run: |
          docker push ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ github.sha }}
